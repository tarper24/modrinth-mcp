name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch/PR makes the older run redundant.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    name: Manifests match package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Uses only Node built-ins, so no install is needed.
      - run: npm run check-version

  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24] # package.json engines: >=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Offline suite (mocked fetch + in-memory MCP transport); the live API
      # tests stay skipped because MODRINTH_LIVE is unset.
      - run: npm test
